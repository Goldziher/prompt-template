name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv

      - name: Install Dependencies
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
